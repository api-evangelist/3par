name: 3PAR (HPE 3PAR StoreServ)
description: >-
  3PAR is an enterprise storage platform, now part of Hewlett Packard Enterprise (HPE
  acquired 3PAR in 2010), that powers mission-critical applications with HPE 3PAR StoreServ
  and Primera arrays. For developers and automation engineers, 3PAR exposes the HPE 3PAR
  Web Services API (WSAPI) — a REST interface that manages storage provisioning, virtual
  volumes, hosts, ports, CPGs, snapshots, and remote copy on 3PAR/Primera/Alletra arrays,
  offering a more flexible and programmable alternative to the 3PAR Command Line Interface.
  HPE publishes first-party client libraries (Python, Ruby, PowerShell) plus Ansible,
  Puppet, Chef, OpenStack Cinder, and Docker volume integrations against WSAPI. This
  profile was surfaced as a venture-portfolio lead (Mayfield, Menlo Ventures backed the
  original 3PAR before its IPO and HP acquisition) and enriched from HPE's public developer
  surface.
